<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Coffee Shop POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loading-overlay {position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .cart-scrollbar::-webkit-scrollbar { width: 5px; }
    .cart-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
    .cart-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .cart-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

  <div id="loading" class="loading-overlay hidden bg-slate-900 bg-opacity-70 flex flex-col gap-3 text-white font-medium text-lg backdrop-blur-sm">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-500 border-t-transparent"></div>
    <span class="tracking-wide">กำลังเชื่อมต่อฐานข้อมูล...</span>
  </div>

  <div class="flex h-screen overflow-hidden w-full">
    <div id="left-panel" class="w-3/5 p-8 overflow-y-auto flex flex-col h-full no-scrollbar transition-all duration-300">
      <div class="flex justify-between items-center mb-8 border-b border-slate-200 pb-5">
        <div>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight" id="page-title">☕ Coffee Shop POS</h1>
        </div>
        <div class="flex bg-slate-200 bg-opacity-70 p-1 rounded-xl gap-1 items-center">
          <button onclick="switchMode('pos')" id="btn-pos" class="bg-white text-slate-800 px-4 py-2 rounded-lg font-semibold shadow-sm text-xs transition-all">หน้าขายสินค้า</button>
          <button onclick="switchMode('admin')" id="btn-admin" class="text-slate-600 hover:text-slate-900 px-4 py-2 rounded-lg font-semibold text-xs transition-all">⚙️ หลังบ้าน</button>
          <button onclick="switchMode('report')" id="btn-report" class="text-slate-600 hover:text-slate-900 px-4 py-2 rounded-lg font-semibold text-xs transition-all">📊 ประวัติ</button>
          <button id="toggle-cart-btn" onclick="toggleCartPanel()" class="ml-2 bg-amber-800 hover:bg-amber-950 text-white font-bold text-xs px-3 py-2 rounded-lg transition-all shadow-sm">
            <span id="toggle-cart-text">ซ่อนตะกร้า</span>
          </button>
        </div>
      </div>
      <div id="pos-view" class="grid grid-cols-3 gap-5 transition-all duration-300"></div>
      <div id="admin-view" class="hidden space-y-8">... (โค้ดหลังบ้านเดิมของคุณ) ...</div>
      <div id="report-view" class="hidden">... (โค้ดรายงานเดิมของคุณ) ...</div>
    </div>

    <div id="cart-panel" class="w-2/5 bg-white shadow-2xl flex flex-col h-full border-l border-slate-100 transition-all duration-300">
      <div class="p-6 border-b border-slate-100 flex flex-col flex-1 overflow-hidden">
        <h2 class="text-base font-bold text-slate-800 mb-4">🛒 ตะกร้าออเดอร์</h2>
        <div id="cart-items" class="space-y-3 overflow-y-auto flex-1 pr-1 cart-scrollbar"></div>
      </div>
      <div class="p-6 bg-slate-50 border-t border-slate-100 space-y-4">
        <div class="flex justify-between text-lg font-bold"><span>รวม:</span><span id="total-price" class="text-amber-800">0</span></div>
        <button onclick="checkout()" class="w-full bg-amber-800 text-white py-3 rounded-xl font-bold">ยืนยันการชำระเงิน</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "2026";
    let isCartVisible = true;

    // 1. ฟังก์ชันเปิด/ปิดตะกร้า
    function toggleCartPanel() {
      const cartPanel = document.getElementById('cart-panel');
      const leftPanel = document.getElementById('left-panel');
      const posView = document.getElementById('pos-view');
      isCartVisible = !isCartVisible;
      
      cartPanel.classList.toggle('hidden', !isCartVisible);
      leftPanel.className = isCartVisible ? "w-3/5 p-8 overflow-y-auto flex flex-col h-full no-scrollbar transition-all" : "flex-1 p-8 overflow-y-auto flex flex-col h-full no-scrollbar transition-all";
      posView.className = isCartVisible ? "grid grid-cols-3 gap-5 transition-all" : "grid grid-cols-4 gap-5 transition-all";
      document.getElementById('toggle-cart-text').innerText = isCartVisible ? "ซ่อนตะกร้า" : "เปิดตะกร้า";
    }

    // 2. ฟังก์ชันลบสินค้าแบบปลอดภัย (ต้องใส่รหัส)
    async function deleteProduct(id) {
      const inputPwd = prompt("🔒 กรุณากรอกรหัสผ่านผู้ดูแลเพื่อลบสินค้า:");
      if (inputPwd !== ADMIN_PASSWORD) {
        alert("❌ รหัสผ่านไม่ถูกต้อง! คุณไม่มีสิทธิ์ลบสินค้า");
        return;
      }
      if (confirm("ลบเมนูเครื่องดื่มรายการนี้ออกถาวรใช่ไหม?")) {
        products = products.filter(p => p.id !== id);
        await uploadDataToCloud();
        renderAll();
      }
    }

    // ... (ฟังก์ชันอื่นๆ ของคุณคงเดิม) ...
    window.onload = fetchDataFromCloud;
  </script>
</body>
</html>
